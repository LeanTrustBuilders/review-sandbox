name: "Change the state of a review"
description: "Withdraw your review; mark a problem fixed, intended or not a problem; mark a question answered; reopen."
title: "Status: "
labels: ["evidence:status"]
body:
  - type: markdown
    attributes:
      value: "Usually opened from the buttons under a review, with its id filled in. It is recorded if your account may make the change: the author of a review can withdraw it; the reporter of a problem, the asker of a question, and the maintainers can resolve or reopen it. The same changes can be made by commenting on the review's own issue (`/withdraw`, `/fixed <commit>`, …)."
  - type: input
    id: record
    attributes:
      label: "Record"
      description: "The id of the review, problem or question: 16 hexadecimal digits."
    validations:
      required: true
  - type: input
    id: action
    attributes:
      label: "Change"
      description: "One of: withdraw, fixed, intended, invalid, answered, reopen."
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: "Fixed in"
      description: "For `fixed`: the commit that fixed it."
  - type: textarea
    id: note
    attributes:
      label: "Note"
  - type: dropdown
    id: who
    attributes:
      label: "Written by"
      description: "A review by an AI agent is shown as one, and counted apart."
      options:
        - "me, a person"
        - "an AI agent, run by me"
  - type: input
    id: agent
    attributes:
      label: "Agent"
      description: "If an AI agent wrote this: its tool and model, e.g. `Claude Code, claude-opus-5-5`."
