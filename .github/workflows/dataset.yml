name: Dataset

# Builds the library and publishes its dataset (S2) as the release dataset-<commit12>: what intake
# keys every record by, and what the claim's page is built from. Then rebuilds the page.
on:
  push:
    branches: [main]
    paths: ['Sandbox/**', 'Sandbox.lean', 'lakefile.toml', 'lake-manifest.json', 'lean-toolchain']
  workflow_dispatch:
    inputs:
      replace:
        description: Extract again and replace the published dataset (for a new extractor release)
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: dataset-${{ github.sha }}

jobs:
  dataset:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Already published?
        id: tag
        run: |
          tag="dataset-$(git rev-parse HEAD | cut -c1-12)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" > /dev/null 2>&1 && [ "${{ inputs.replace }}" != "true" ]; then
            echo "$tag is already published"; echo "done=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Lean
        if: steps.tag.outputs.done != 'true'
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build the library
        if: steps.tag.outputs.done != 'true'
        run: lake build
      - if: steps.tag.outputs.done != 'true'
        uses: LeanTrustBuilders/extractor/extract@main
        with:
          root: Sandbox
          repo: ${{ github.repository }}
          publish: ${{ steps.tag.outputs.tag }}
          replace: ${{ inputs.replace || 'false' }}
      - name: Rebuild the page, and read the issues waiting for this dataset
        if: steps.tag.outputs.done != 'true'
        run: |
          gh workflow run pages.yml --ref main
          gh workflow run evidence-intake.yml --ref main
